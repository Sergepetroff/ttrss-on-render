services:
  - type: web
    name: ttrss
    runtime: image
    image:
      url: wangqiru/ttrss:nightly
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: SELF_URL_PATH
        value: https://ttrss-nq00t.onrender.com
      - key: DB_TYPE
        value: pgsql
      - key: DB_HOST
        value: aws-1-eu-west-1.pooler.supabase.com
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        value: postgres.cajwhyrkxnndhxaxjggg
      - key: DB_PASS
        value: "!Q@W1q2w!Q@W"
      - key: DB_SSLMODE
        value: require
      - key: PUID
        value: "1000"
      - key: PGID
        value: "1000"
      - key: MERCURY_URL
        value: https://mercury-parser-nq00t.onrender.com
      - key: OPENCC_URL
        value: https://opencc-api-nq00t.onrender.com
      - key: RSSHUB_URL
        value: https://rsshub-nq00t.onrender.com
    autoDeploy: true

  - type: web
    name: mercury-parser
    runtime: image
    image:
      url: wangqiru/mercury-parser-api:latest
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: production
    autoDeploy: true

  - type: web
    name: morss
    runtime: image
    image:
      url: pictuga/morss:latest
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "8000"
      - key: MORSS_PORT
        value: "8000"
      - key: TIMEOUT
        value: "60"
      - key: MAX_TIME
        value: "120"
      - key: MAX_ITEM
        value: "50"
      - key: LIM_TIME
        value: "180"
      - key: LIM_ITEM
        value: "100"
      - key: CACHE_SIZE
        value: "100"
      - key: CACHE_LIFESPAN
        value: "1800"
      - key: DELAY
        value: "600"
    autoDeploy: true

  - type: web
    name: rsshub
    runtime: image
    image:
      url: diygod/rsshub:latest
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "1200"
      - key: CACHE_TYPE
        value: memory
      - key: NODE_ENV
        value: production
      - key: DEBUG_INFO
        value: "false"
      - key: LOGGER_LEVEL
        value: "error"
      - key: NO_LOGFILES
        value: "true"
    autoDeploy: true
