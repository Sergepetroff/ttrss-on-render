services:
  - type: web
    name: ttrss
    runtime: image
    image:
      url: wangqiru/ttrss:latest
    plan: free
    region: oregon
    envVars:
      - key: SELF_URL_PATH
        value: https://ttrss-nq00t.onrender.com
      - key: DB_HOST
        fromDatabase:
          name: ttrss-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ttrss-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: ttrss-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: ttrss-db
          property: user
      - key: DB_PASS
        fromDatabase:
          name: ttrss-db
          property: password
      - key: PUID
        value: "1000"
      - key: PGID
        value: "1000"
      - key: MERCURY_URL
        value: https://mercury-parser-nq00t.onrender.com
      - key: OPENCC_URL
        value: https://opencc-api-nq00t.onrender.com
      - key: RSSHUB_URL
        value: https://rsshub-nq00t.onrender.com
    autoDeploy: true

  - type: web
    name: mercury-parser
    runtime: image
    image:
      url: wangqiru/mercury-parser-api:latest
    plan: free
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
    autoDeploy: true

  - type: web
    name: opencc-api
    runtime: image
    image:
      url: wangqiru/opencc-api-server:latest
    plan: free
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
    autoDeploy: true

  - type: web
    name: morss
    runtime: image
    image:
      url: pictuga/morss:latest
    plan: free
    region: oregon
    envVars:
      - key: MORSS_PORT
        value: "8000"
    autoDeploy: true

  - type: web
    name: rsshub
    runtime: image
    image:
      url: diygod/rsshub:latest
    plan: free
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEBUG_INFO
        value: "false"
      - key: LOGGER_LEVEL
        value: "error"
      - key: NO_LOGFILES
        value: "true"
    autoDeploy: true

databases:
  - name: ttrss-db
    plan: free
