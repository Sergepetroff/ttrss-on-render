services:
  - type: web
    name: ttrss
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SELF_URL_PATH
        value: https://ttrss.onrender.com/
      - key: DB_TYPE
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: ttrss-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ttrss-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: ttrss-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ttrss-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: ttrss-db
          property: database
    autoDeploy: true
databases:
  - name: ttrss-db
    plan: free
